<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleziona Ingredienti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .content {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .category {
            margin-bottom: 25px;
        }

        .category-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #667eea;
        }

        .ingredient-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin-bottom: 8px;
            background: #f5f5f5;
            border-radius: 8px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .ingredient-item:hover {
            background: #efefef;
            border-color: #667eea;
        }

        .ingredient-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .ingredient-label {
            flex: 1;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            user-select: none;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            background: white;
            border-radius: 5px;
            border: 1px solid #ddd;
        }

        .quantity-controls button {
            width: 28px;
            height: 28px;
            border: none;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 16px;
            border-radius: 3px;
            transition: background 0.2s;
        }

        .quantity-controls button:hover {
            background: #764ba2;
        }

        .quantity-display {
            width: 35px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            color: #333;
        }

        .ingredient-item input[type="checkbox"]:not(:checked) ~ .quantity-controls {
            opacity: 0.3;
            pointer-events: none;
        }

        .footer {
            display: flex;
            gap: 10px;
            padding: 20px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🥗 Seleziona Ingredienti</h1>
            <p>Scegli gli ingredienti che vuoi nella tua settimana</p>
        </div>

        <div class="content" id="content">
            <div class="loading">Caricamento...</div>
        </div>

        <div class="footer">
            <button class="btn btn-secondary" onclick="cancelSelection()">Annulla</button>
            <button class="btn btn-primary" onclick="saveSelection()">Salva Selezione</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
